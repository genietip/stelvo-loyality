            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          description: Maximum feed items to return per page
        - name: cursor
          in: query
          schema:
            type: string
          description: >-
            Opaque keyset cursor (the next_cursor of the previous page). Omit
