          type: ["string", "null"]
        warning_code:
          type: ["string", "null"]
          description: Machine-readable reason when library_saved is false (e.g. "storage_full").
      required: [image_url]

    GenerateVideoInput:
      type: object
      properties:
        caption:
          type: ["string", "null"]
        video_suggestion:
          type: ["string", "null"]

