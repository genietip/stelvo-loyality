  # ── Loyalty — customer side ─────────────────────────────────────────────────
  /loyalty/join-info/{code}:
    get:
      operationId: getJoinInfo
      tags: [loyalty]
      summary: Public lookup of a business by loyalty join code (for the QR landing page)
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Business info for the join code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinInfoReply"
        "404":
          description: No business found for that code

  /loyalty/businesses:
    get:
      operationId: listLoyaltyBusinesses
      tags: [loyalty]
      summary: Public directory of businesses with an active loyalty program, searchable by name or industry
      security: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Case-insensitive match against business name
        - name: industry
          in: query
          schema:
            type: string
          description: Filter to a single industry
        - name: zip
          in: query
          schema:
            type: string
          description: Customer's postal code — businesses with the same zip are ranked first
        - name: city
          in: query
          schema:
            type: string
          description: Customer's city — businesses in the same city rank ahead of the rest
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          description: Maximum businesses to return per page
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of businesses to skip (for paging)
      responses:
        "200":
          description: Participating businesses (nearest first when zip/city provided)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverBusinessesReply"

  /loyalty/wallet/join:
