          type: ["string", "null"]
        caption:
          type: string
        image_url:
          type: ["string", "null"]
        video_url:
          type: ["string", "null"]
        platform:
          type: string
        scheduled_at:
          type: string
        client_key:
          type: ["string", "null"]
          description: >
            Optional client idempotency key. Identical schedule requests (same
            key + platform) within a short window return the existing scheduled
            post instead of creating a duplicate, and the scheduled sweep will
            never publish two rows carrying the same key.

