components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    # ── Chat (FAQ bot) ──────────────────────────────────────────────────────
    ChatFaqMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required: [role, content]

    ChatFaqInput:
      type: object
      properties:
        message:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatFaqMessage"
      required: [message]

    ChatFaqReply:
      type: object
      properties:
        reply:
          type: string
      required: [reply]

    # ── Auth ──────────────────────────────────────────────────────────────
    SignupInput:
      type: object
      required: [business_name, email, password]
      properties:
        business_name:
          type: string
        email:
          type: string
        password:
          type: string
        client_fingerprint:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        merchant:
          $ref: "#/components/schemas/Merchant"
        requires_phone_verification:
          type: ["boolean", "null"]
      required: [token, merchant]

    # ── Merchant ──────────────────────────────────────────────────────────
    Merchant:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        business_name:
          type: string
        industry:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        zip_code:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
          description: Street address shown to loyalty customers for directions
        timezone:
          type: ["string", "null"]
        logo_url:
          type: ["string", "null"]
        brand_color_1:
          type: ["string", "null"]
        brand_color_2:
          type: ["string", "null"]
        brand_voice:
          type: ["string", "null"]
        business_description:
          type: ["string", "null"]
        website_url:
          type: ["string", "null"]
        social_instagram:
          type: ["string", "null"]
        social_x:
          type: ["string", "null"]
        social_facebook:
          type: ["string", "null"]
        social_whatsapp:
          type: ["string", "null"]
        subscription_tier:
          type: string
          enum: [free, starter, growth, agency]
        trial_ends_at:
          type: ["string", "null"]
        onboarding_completed:
          type: boolean
        onboarding_step:
          type: ["integer", "null"]
        email_verified:
          type: boolean
        post_count_this_month:
          type: ["integer", "null"]
        created_at:
          type: string
      required: [id, email, business_name, subscription_tier, onboarding_completed, email_verified]

    MerchantResponse:
      type: object
      properties:
        merchant:
          $ref: "#/components/schemas/Merchant"
      required: [merchant]

    MerchantUpdate:
      type: object
      properties:
        business_name:
          type: string
        city:
          type: string
        zip_code:
          type: string
        address:
          type: string
        timezone:
          type: string
        logo_url:
          type: string
        brand_color_1:
          type: string
        brand_color_2:
          type: string
        brand_voice:
          type: string
        business_description:
          type: string
        website_url:
          type: string
        social_instagram:
          type: string
        social_x:
          type: string
        social_facebook:
          type: string
        social_whatsapp:
          type: string
        industry:
          type: string
        onboarding_completed:
          type: boolean
        onboarding_step:
          type: integer

    MerchantStats:
      type: object
      properties:
        total_posts:
          type: integer
        posts_this_month:
          type: integer
        subscription_tier:
          type: string
        created_count:
          type: integer
        draft_count:
          type: integer
        scheduled_count:
          type: integer
        sent_count:
          type: integer
        engagement:
          type: object
          properties:
            reach:
              type: integer
            likes:
              type: integer
            comments:
              type: integer
          required: [reach, likes, comments]
        last_synced_at:
          type: ["string", "null"]
          description: When engagement metrics were last refreshed from the Graph API
      required: [total_posts, posts_this_month, subscription_tier, created_count, draft_count, scheduled_count, sent_count, engagement]

    WeatherData:
      type: object
      properties:
        temp:
          type: ["number", "null"]
        description:
          type: ["string", "null"]
        icon:
          type: ["string", "null"]
        city:
          type: ["string", "null"]

    # ── Suggestions ───────────────────────────────────────────────────────
    Suggestion:
      type: object
      properties:
        id:
          type: string
        caption_preview:
          type: string
        theme:
          type: string
        tone:
          type: string
        angle:
          type: string
        context_snapshot:
          type: ["object", "null"]
        generated_at:
          type: string
      required: [id, caption_preview, theme, tone, angle]

    SuggestionsResponse:
      type: object
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/Suggestion"
      required: [suggestions]

    RefreshSuggestionsInput:
      type: object
      properties:
        checkin_input:
          type: ["string", "null"]

    # ── Generate ──────────────────────────────────────────────────────────
    GenerateCaptionsInput:
      type: object
      properties:
        tone:
          type: string
        custom_prompt:
          type: ["string", "null"]
        template_id:
          type: ["string", "null"]
        checkin_input:
          type: ["string", "null"]
        platform:
          type: string

    Caption:
      type: object
      properties:
        text:
          type: string
        hashtags:
          type: array
          items:
            type: string
        theme:
          type: string
        tone:
          type: string
        angle:
          type: string
        why:
          type: ["string", "null"]
      required: [text, hashtags, theme, tone, angle]

    CaptionsResult:
      type: object
      properties:
        captions:
          type: array
          items:
            $ref: "#/components/schemas/Caption"
        image_suggestion:
          type: ["string", "null"]
        context_used:
          type: ["object", "null"]
      required: [captions]

    GenerateImageInput:
      type: object
      properties:
        caption:
          type: ["string", "null"]
        image_suggestion:
