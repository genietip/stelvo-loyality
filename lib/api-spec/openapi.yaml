          type: ["string", "null"]
        ends_at:
          type: ["string", "null"]
        target_gender:
          type: ["string", "null"]
          description: Gender this deal was targeted to (null = everyone)
        target_interests:
          type: ["array", "null"]
          items:
            type: string
          description: Interests this deal was targeted to (null/empty = everyone)
        created_at:
          type: string
      required: [id, merchant_id, title, created_at]

    WalletBusinessDetailReply:
      type: object
      properties:
        membership:
          $ref: "#/components/schemas/WalletEntry"
        reward_tiers:
          type: array
          items:
            $ref: "#/components/schemas/RewardTier"
        deals:
          type: array
          items:
            $ref: "#/components/schemas/Deal"
      required: [membership, reward_tiers, deals]

    WalletBusinessUpdate:
      type: object
      properties:
        muted:
          type: boolean
        opted_in:
          type: boolean

    # ── Loyalty — feed ───────────────────────────────────────────────────────
    FeedItem:
      type: object
      properties:
        delivery_id:
          type: string
        deal:
          $ref: "#/components/schemas/Deal"
        business_name:
          type: string
        delivered_at:
          type: string
        opened_at:
          type: ["string", "null"]
      required: [delivery_id, deal, business_name, delivered_at]

    LoyaltyFeedReply:
      type: object
      properties:
        feed:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        has_more:
          type: boolean
        next_cursor:
          type: ["string", "null"]
          description: Cursor for the next page, or null when has_more is false
      required: [feed, has_more, next_cursor]

    RegisterPushTokenInput:
      type: object
      properties:
        token:
          type: ["string", "null"]
          description: Expo push token, or null to unregister

    # ── Loyalty — redemptions ────────────────────────────────────────────────
    CreateRedemptionInput:
      type: object
      required: [merchant_id]
      properties:
        merchant_id:
          type: string
        reward_tier_id:
          type: ["string", "null"]
        deal_id:
          type: ["string", "null"]

    Redemption:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        customer_id:
          type: string
        reward_tier_id:
          type: ["string", "null"]
        deal_id:
          type: ["string", "null"]
        points_spent:
          type: integer
        code:
          type: string
        status:
          type: string
          enum: [pending, confirmed, cancelled, expired]
        created_at:
          type: string
        confirmed_at:
          type: ["string", "null"]
        expires_at:
          type: ["string", "null"]
          description: When a pending code stops being redeemable (computed by the server)
      required: [id, merchant_id, customer_id, points_spent, code, status, created_at]

    RedemptionReply:
      type: object
      properties:
        redemption:
          $ref: "#/components/schemas/Redemption"
      required: [redemption]

    RedemptionsReply:
      type: object
      properties:
        redemptions:
          type: array
          items:
            $ref: "#/components/schemas/Redemption"
        has_more:
          type: boolean
        offset:
          type: integer
      required: [redemptions, has_more, offset]

    ConfirmRedemptionInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    # ── Loyalty — business settings ──────────────────────────────────────────
    LoyaltySettingsReply:
      type: object
      properties:
        join_code:
          type: string
        event_types:
          type: object
          additionalProperties:
            type: integer
      required: [join_code, event_types]

    LoyaltySettingsUpdate:
      type: object
      required: [event_types]
      properties:
        event_types:
          type: object
          additionalProperties:
            type: integer

    # ── Loyalty — business members ───────────────────────────────────────────
    LoyaltyMember:
      type: object
      properties:
        customer_id:
          type: string
        name:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        points:
          type: integer
        visits:
          type: integer
        last_activity:
          type: string
        joined_at:
          type: string
      required: [customer_id, name, points, visits, last_activity, joined_at]

    LoyaltyMembersReply:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/LoyaltyMember"
      required: [members]

    CreditPointsInput:
      type: object
      required: [event_type]
      properties:
        event_type:
          type: string
        points:
          type: ["integer", "null"]
          description: Optional override; defaults to the configured points for the event type

    CreditPointsReply:
      type: object
      properties:
        points_credited:
          type: integer
        total_points:
          type: integer
      required: [points_credited, total_points]

    # ── Loyalty — earn codes ─────────────────────────────────────────────────
    EarnCodeInput:
      type: object
      required: [points]
      properties:
        points:
          type: integer
          description: Points a customer earns by scanning this code (1–100000)
        single_use:
          type: boolean
          description: When true, only the first customer to scan can claim; otherwise each member may claim once until expiry
        expires_in_minutes:
          type: integer
          minimum: 1
          maximum: 1440
          description: Minutes until the code expires (default 15)

    EarnCodeReply:
      type: object
      properties:
        code:
          type: string
        points:
          type: integer
        single_use:
          type: boolean
        expires_at:
          type: string
      required: [code, points, single_use, expires_at]

    ClaimEarnInput:
      type: object
      required: [code]
      properties:
        code:
          type: string

    ClaimEarnReply:
      type: object
      properties:
        points_credited:
          type: integer
        total_points:
          type: integer
        merchant_id:
          type: string
        business_name:
          type: string
      required: [points_credited, total_points, merchant_id, business_name]

    # ── Loyalty — reward tiers ───────────────────────────────────────────────
    RewardTierInput:
      type: object
      required: [name, points_required]
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        points_required:
          type: integer
        active:
          type: boolean

    RewardTierUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        points_required:
          type: integer
        active:
          type: boolean

    RewardTierReply:
      type: object
      properties:
        reward_tier:
          $ref: "#/components/schemas/RewardTier"
      required: [reward_tier]

    RewardTiersReply:
      type: object
      properties:
        reward_tiers:
          type: array
          items:
            $ref: "#/components/schemas/RewardTier"
      required: [reward_tiers]

    # ── Loyalty — deals & analytics ──────────────────────────────────────────
    DealInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: ["string", "null"]
        starts_at:
          type: ["string", "null"]
        ends_at:
          type: ["string", "null"]
        target_gender:
          type: ["string", "null"]
          description: Only deliver to members with this gender on file (null = everyone)
        target_interests:
          type: ["array", "null"]
          items:
            type: string
          description: Only deliver to members with at least one of these interests (null/empty = everyone)

    DealAudienceReply:
      type: object
      properties:
        count:
          type: integer
      required: [count]

    BirthdayRewardInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
        points:
          type: ["integer", "null"]

    BirthdayRewardReply:
      type: object
      properties:
        enabled:
          type: boolean
        points:
          type: ["integer", "null"]
      required: [enabled, points]

    DemographicCount:
      type: object
      properties:
        label:
          type: string
        count:
          type: integer
      required: [label, count]

    LoyaltyDemographics:
      type: object
      properties:
        total_members:
          type: integer
        profiles_completed:
          type: integer
        with_birthday:
          type: integer
        by_gender:
          type: array
          items:
            $ref: "#/components/schemas/DemographicCount"
        by_interest:
          type: array
          items:
            $ref: "#/components/schemas/DemographicCount"
        birthdays_by_month:
          type: array
          items:
            type: integer
      required: [total_members, profiles_completed, with_birthday, by_gender, by_interest, birthdays_by_month]

    DealCreateReply:
      type: object
      properties:
        deal:
          $ref: "#/components/schemas/Deal"
        delivered:
          type: integer
      required: [deal, delivered]

    DealsReply:
      type: object
      properties:
        deals:
          type: array
          items:
            $ref: "#/components/schemas/Deal"
      required: [deals]

    DealAnalyticsReply:
      type: object
      properties:
        deal_id:
          type: string
        delivered:
          type: integer
        opened:
          type: integer
        redeemed:
          type: integer
      required: [deal_id, delivered, opened, redeemed]

    DealStat:
      type: object
      properties:
        deal_id:
          type: string
        title:
          type: string
        created_at:
          type: string
        delivered:
          type: integer
        opened:
          type: integer
        redeemed:
          type: integer
      required: [deal_id, title, created_at, delivered, opened, redeemed]

    DealOpenEvent:
      type: object
      properties:
        deal_id:
          type: string
        opened_at:
          type: string
      required: [deal_id, opened_at]

    LoyaltyBusinessAnalyticsReply:
      type: object
      properties:
        deals:
          type: array
          items:
            $ref: "#/components/schemas/DealStat"
        open_events:
          type: array
          items:
            $ref: "#/components/schemas/DealOpenEvent"
        demographics:
          $ref: "#/components/schemas/LoyaltyDemographics"
      required: [deals, open_events, demographics]
