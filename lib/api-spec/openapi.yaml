          type: ["string", "null"]
        caption:
          type: string
        image_url:
          type: ["string", "null"]
        video_url:
          type: ["string", "null"]
        platform:
          type: string
      required: [caption, platform]

    PublishResult:
      type: object
      properties:
        success:
          type: boolean
        results:
          type: array
          items:
            type: object
      required: [success]

    SchedulePostInput:
      type: object
