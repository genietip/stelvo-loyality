          type: ["string", "null"]
        warning_code:
          type: ["string", "null"]
          description: Machine-readable reason when library_saved is false (e.g. "storage_full").
      required: [video_url]

    SavePostInput:
      type: object
      required: [caption, platform]
      properties:
        caption:
          type: string
        image_url:
          type: ["string", "null"]
        video_url:
          type: ["string", "null"]
        platform:
          type: string
        theme:
          type: ["string", "null"]
        tone:
          type: ["string", "null"]
        angle:
          type: ["string", "null"]
        context_used:
          type: ["object", "null"]
        template_id:
          type: ["string", "null"]
        client_key:
          type: ["string", "null"]
          description: >
            Optional client idempotency key. Identical saves (same key +
            platform) within a short window return the existing draft instead
            of creating a duplicate, and /publish/now will never publish two
            rows carrying the same key.
          pattern: "^[A-Za-z0-9_-]{8,120}$"

    # ── Post ──────────────────────────────────────────────────────────────
    Post:
      type: object
      properties:
        id:
          type: string
        merchant_id:
          type: string
        caption:
          type: string
        image_url:
          type: ["string", "null"]
        video_url:
          type: ["string", "null"]
        platform:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published, failed]
        theme:
          type: ["string", "null"]
        tone:
          type: ["string", "null"]
        angle:
          type: ["string", "null"]
        scheduled_at:
          type: ["string", "null"]
        published_at:
          type: ["string", "null"]
        last_error:
          type: ["string", "null"]
          description: Why the most recent publish attempt failed; null after a successful publish.
        retrying:
          type: boolean
          description: True for a scheduled post whose last automatic publish attempt hit a transient error and will be retried on a later sweep.
        reach:
          type: ["integer", "null"]
        likes:
          type: ["integer", "null"]
        comments:
          type: ["integer", "null"]
        engagement:
          type: ["integer", "null"]
        created_at:
          type: string
      required: [id, merchant_id, caption, platform, status, created_at]

    PostResponse:
      type: object
      properties:
        post:
          $ref: "#/components/schemas/Post"
        deduped:
          type: ["boolean", "null"]
          description: True when an existing draft with the same client_key was returned instead of creating a new row.
      required: [post]

    PostsResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
      required: [posts]

