openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Stelvo AI Marketing Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: merchants
    description: Merchant profile and settings
  - name: suggestions
    description: AI post suggestions
  - name: generate
    description: AI content generation
  - name: publish
    description: Social media publishing
  - name: templates
    description: Post templates
  - name: analytics
    description: Post analytics
  - name: media
    description: Media library
  - name: social
    description: Social account connections
  - name: billing
    description: Subscription and billing
  - name: schedule
    description: Scheduled posts
  - name: recurring
    description: Recurring schedules
  - name: chat
    description: FAQ chatbot
  - name: loyalty-auth
    description: Loyalty App customer authentication
  - name: loyalty
    description: Customer-side loyalty wallet, feed, and redemptions
  - name: loyalty-business
    description: Business-side loyalty program management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new merchant account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current merchant
      responses:
        "200":
          description: Current merchant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Merchants ─────────────────────────────────────────────────────────────
  /merchants/me:
    get:
      operationId: getMerchant
      tags: [merchants]
      summary: Get merchant profile
      responses:
        "200":
          description: Merchant profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantResponse"
    patch:
      operationId: updateMerchant
      tags: [merchants]
      summary: Update merchant profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantResponse"

  /merchants/weather:
    get:
      operationId: getWeather
      tags: [merchants]
      summary: Get local weather for merchant
      responses:
        "200":
          description: Weather data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherData"

  /merchants/stats:
    get:
      operationId: getMerchantStats
      tags: [merchants]
      summary: Get merchant post statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchantStats"

  # ── Suggestions ───────────────────────────────────────────────────────────
  /suggestions/today:
    get:
      operationId: getTodaySuggestions
      tags: [suggestions]
      summary: Get today's AI post suggestions
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"

  /suggestions/refresh:
    post:
      operationId: refreshSuggestions
      tags: [suggestions]
      summary: Generate fresh suggestions
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshSuggestionsInput"
      responses:
        "200":
          description: Fresh suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"

  /suggestions/{id}/skip:
    post:
      operationId: skipSuggestion
      tags: [suggestions]
      summary: Skip a suggestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /suggestions/{id}/use:
    post:
      operationId: useSuggestion
      tags: [suggestions]
      summary: Mark suggestion as used
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Chat (FAQ bot) ──────────────────────────────────────────────────────
  /chat/faq:
    post:
      operationId: chatFaq
      tags: [chat]
      summary: Ask the Stelvo FAQ chatbot a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatFaqInput"
      responses:
        "200":
          description: Chatbot reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatFaqReply"

  # ── Generate ──────────────────────────────────────────────────────────────
  /generate/captions:
    post:
      operationId: generateCaptions
      tags: [generate]
      summary: Generate AI captions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateCaptionsInput"
      responses:
        "200":
          description: Generated captions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaptionsResult"

  /generate/image:
    post:
      operationId: generateImage
      tags: [generate]
      summary: Generate an AI image for the post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImageInput"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageResult"

  /generate/video:
    post:
      operationId: generateVideo
      tags: [generate]
      summary: Generate a short AI video clip for the post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateVideoInput"
      responses:
        "200":
          description: Generated video
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoGenResult"

  /generate/save-post:
    post:
      operationId: savePost
      tags: [generate]
      summary: Save a generated post as draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavePostInput"
      responses:
        "200":
          description: Saved post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"

  # ── Publish ───────────────────────────────────────────────────────────────
  /publish/now:
    post:
      operationId: publishNow
      tags: [publish]
      summary: Publish post immediately to social media
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishNowInput"
      responses:
        "200":
          description: Publish result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishResult"

  /publish/schedule:
    post:
      operationId: schedulePost
      tags: [publish]
      summary: Schedule a post for later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchedulePostInput"
      responses:
        "200":
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostResponse"

  /publish/scheduled:
    get:
      operationId: getScheduledPosts
      tags: [publish]
      summary: Get all scheduled posts
      responses:
        "200":
          description: Scheduled posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsResponse"

  /publish/scheduled/{id}:
    delete:
      operationId: cancelScheduledPost
      tags: [publish]
      summary: Cancel a scheduled post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /publish/failed:
    get:
      operationId: getFailedPosts
      tags: [publish]
      summary: Get posts whose publish failed
      responses:
        "200":
          description: Failed posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsResponse"

  /publish/drafts:
    get:
      operationId: getDraftPosts
      tags: [publish]
      summary: Get saved draft posts (not yet scheduled or published)
      responses:
        "200":
          description: Draft posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsResponse"

  /publish/history:
    get:
      operationId: getPostHistory
      tags: [publish]
      summary: Get published post history
      responses:
        "200":
          description: Published posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostsResponse"

  # ── Templates ─────────────────────────────────────────────────────────────
  /templates:
    get:
      operationId: getTemplates
      tags: [templates]
      summary: Get templates for merchant's industry
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: tone
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplatesResponse"

  /templates/{id}:
    get:
      operationId: getTemplate
      tags: [templates]
      summary: Get a single template
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateResponse"

  # ── Analytics ─────────────────────────────────────────────────────────────
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Get analytics overview
      responses:
        "200":
          description: Analytics overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"

  /analytics/post/{id}:
    get:
      operationId: getPostAnalytics
      tags: [analytics]
      summary: Get detailed analytics for a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostAnalytics"

  /analytics/sync:
    post:
      operationId: syncAnalytics
      tags: [analytics]
      summary: Sync analytics from Meta
      responses:
        "200":
          description: Synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Media Library ─────────────────────────────────────────────────────────
  /media:
    get:
      operationId: getMediaLibrary
      tags: [media]
      summary: Get merchant's media library
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [image, video]
        - name: favorited
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Media items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaLibraryResponse"

  /media/storage-status:
    get:
      operationId: getStorageStatus
      tags: [media]
      summary: Get storage usage
      responses:
        "200":
          description: Storage status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageStatus"

  /media/{id}/favorite:
    post:
      operationId: toggleFavorite
      tags: [media]
      summary: Toggle favorite on a media item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /media/{id}:
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete a media item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Brand Assets ──────────────────────────────────────────────────────────
  /brand-assets:
    get:
      operationId: getBrandAssets
      tags: [media]
      summary: List the merchant's brand assets (photos, flyers, videos)
      responses:
        "200":
          description: Brand assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandAssetsReply"
    post:
      operationId: registerBrandAsset
      tags: [media]
      summary: Register a brand asset after a direct-to-storage upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandAssetRegisterInput"
      responses:
        "200":
          description: Registered asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandAssetReply"

  /brand-assets/upload-url:
    post:
      operationId: createBrandAssetUploadUrl
      tags: [media]
      summary: Create a short-lived signed URL for uploading a brand asset directly to storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandAssetUploadUrlInput"
      responses:
        "200":
          description: Signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandAssetUploadUrlReply"

  /brand-assets/{id}:
    delete:
      operationId: deleteBrandAsset
      tags: [media]
      summary: Delete a brand asset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Social ────────────────────────────────────────────────────────────────
  /social/accounts:
    get:
      operationId: getSocialAccounts
      tags: [social]
      summary: Get connected social accounts
      responses:
        "200":
          description: Social accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialAccountsResponse"

  /social/accounts/{platform}:
    delete:
      operationId: disconnectSocial
      tags: [social]
      summary: Disconnect a social account
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /platform-credentials:
    get:
      operationId: getPlatformCredentials
      tags: [social]
      summary: List stored posting credentials (never returns passwords)
      responses:
        "200":
          description: Stored credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCredentialsReply"

  /platform-credentials/{platform}:
    put:
      operationId: savePlatformCredential
      tags: [social]
      summary: Store posting credentials for a platform (X, WhatsApp)
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [x, whatsapp]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformCredentialInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCredentialSavedReply"
    delete:
      operationId: deletePlatformCredential
      tags: [social]
      summary: Remove stored posting credentials for a platform
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /platform-credentials/{platform}/test:
    post:
      operationId: testPlatformCredential
      tags: [social]
      summary: Validate stored credentials against the live API without publishing
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [x, whatsapp]
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformCredentialTestReply"

  # ── Billing ───────────────────────────────────────────────────────────────
  /billing/plans:
    get:
      operationId: getBillingPlans
      tags: [billing]
      summary: Get available subscription plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlansResponse"

  /billing/subscription:
    get:
      operationId: getSubscription
      tags: [billing]
      summary: Get current subscription
      responses:
        "200":
          description: Subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionResponse"

  /billing/checkout:
    post:
      operationId: createCheckout
      tags: [billing]
      summary: Create Stripe checkout session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"

  /billing/portal:
    post:
      operationId: createPortal
      tags: [billing]
      summary: Create Stripe customer portal session
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalResponse"

  # ── Recurring Schedules ───────────────────────────────────────────────────
  /recurring-schedules:
    get:
      operationId: getRecurringSchedules
      tags: [recurring]
      summary: Get recurring schedules
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringSchedulesResponse"
    post:
      operationId: createRecurringSchedule
      tags: [recurring]
      summary: Create a recurring schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringScheduleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecurringScheduleResponse"

  /recurring-schedules/{id}:
    patch:
      operationId: updateRecurringSchedule
      tags: [recurring]
      summary: Update a recurring schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecurringScheduleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: deleteRecurringSchedule
      tags: [recurring]
      summary: Delete a recurring schedule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Customers (CRM) ─────────────────────────────────────────────────────────
  /customers:
    get:
      operationId: getCustomers
      tags: [customers]
      summary: Get the merchant's customer contacts
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [existing, prospect]
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Customer contacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomersResponse"
    post:
      operationId: createCustomer
      tags: [customers]
      summary: Add a customer contact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"

  /customers/import:
    post:
      operationId: importCustomers
      tags: [customers]
      summary: Bulk import customer contacts from a spreadsheet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerImportInput"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerImportResult"

  /customers/{id}:
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update a customer contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    delete:
      operationId: deleteCustomer
      tags: [customers]
      summary: Delete a customer contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ── Lead Generation ─────────────────────────────────────────────────────────
  /leads/zips:
    get:
      operationId: getWatchedZips
      tags: [leads]
      summary: List the merchant's watched zip codes
      responses:
        "200":
          description: Watched zip codes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchedZipsResult"
    post:
      operationId: addWatchedZip
      tags: [leads]
      summary: Watch a zip code for new leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchedZipInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchedZipResult"

  /leads/zips/{id}:
    delete:
      operationId: deleteWatchedZip
      tags: [leads]
      summary: Stop watching a zip code
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

